[project]
name = "rolelens"
version = "1.0.0"
description = "Evidence-led Python resume analysis for recruiter review"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.163.1", "uvicorn==0.54.0", "jinja2==3.1.6",
  "python-multipart==0.0.33", "pypdf==7.1.0", "python-docx==1.2.0",
  "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "httpx2==2.16.0", "ruff==0.17.5", "mypy==2.4.1", "reportlab==5.1.0", "lxml-stubs==0.5.1"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
