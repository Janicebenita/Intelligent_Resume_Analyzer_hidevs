name: Quality and container verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.17'
      - name: Install locked Python environment
        run: uv sync --frozen --extra dev
      - name: Strict lint, formatting and types
        run: |
          uv run ruff check app tests scripts
          uv run ruff format --check app tests scripts
          uv run mypy app
      - name: Application and HTTP integration tests (95% coverage gate)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/junit.xml
      - name: Labeled synthetic parser evaluation
        run: uv run python -m scripts.evaluate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: UI lint, formatting and DOM behavior
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run format:check
          npm test
      - name: Upload actual verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-results
          path: artifacts/
  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build non-root production container
        run: docker build -t rolelens:test .
      - name: Verify the complete container HTTP flow
        run: |
          docker run -d --name rolelens -p 7860:7860 rolelens:test
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7860/health && break
            sleep 1
          done
          python scripts/smoke.py --url http://127.0.0.1:7860
      - name: Container diagnostics
        if: failure()
        run: docker logs rolelens
